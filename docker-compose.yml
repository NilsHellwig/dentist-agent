services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://praxis:praxis@postgres:5432/praxis
      KNOWLEDGE_DIR: /knowledge
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      VOICE_HOST_URL: http://host.docker.internal:8001
    volumes:
      - ./backend/app:/app/app
      - ./knowledge:/knowledge:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/call
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
